[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "merasys"
version = "0.5.0"
description = "Sheet-configured agent/Docker monitoring with PostgreSQL-backed alerts"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "gspread>=6.1,<7", "google-auth>=2.35,<3",
  "requests>=2.32,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "python-dotenv>=1.0,<2", "tzdata>=2024.1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
merasys = "monitor.cli:main"

[tool.setuptools.packages.find]
include = ["monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
monitor = ["*.html"]
