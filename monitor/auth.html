<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merasys · Tài khoản</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top left,#d5f5e9,transparent 55%),#f2f6fa;color:#182c42;font:16px/1.6 system-ui,sans-serif;padding:24px}.card{width:100%;max-width:460px;background:#fff;border:1px solid #e0e8ef;border-radius:22px;padding:36px;box-shadow:0 20px 65px #233d5710}.brand{font-weight:800;letter-spacing:-1px;font-size:28px;color:#087e64}.tag{font-size:13px;color:#607488;margin-top:4px}h1{font-size:26px;line-height:1.3;margin:30px 0 10px}p{color:#667b8f;margin:0 0 22px}label{display:grid;gap:6px;margin:16px 0;font-weight:600}input{font:inherit;padding:11px 13px;border:1px solid #d2dde7;border-radius:9px;width:100%;color:#18334a}input:focus{outline:2px solid #80d6b7;outline-offset:2px}button{width:100%;border:0;background:#087e64;color:#fff;border-radius:9px;padding:12px;font:inherit;font-weight:650;margin-top:10px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.error{color:#b4373a;white-space:pre-wrap;font-size:14px;margin-top:14px}.foot{border-top:1px solid #e9eef4;margin-top:25px;padding-top:18px;color:#8393a2;font-size:13px}[hidden]{display:none!important}</style></head>
<body><main class="card"><div class="brand">Merasys</div><div class="tag">GIÁM SÁT HẠ TẦNG TẬP TRUNG</div><h1 id="title">Đang kiểm tra tài khoản…</h1><p id="subtitle">Vui lòng chờ.</p>
<form id="form" hidden><label>Tên đăng nhập<input id="username" required minlength="3" maxlength="64" autocomplete="username" pattern="[A-Za-z0-9_.@\-]+"></label><label>Mật khẩu<input id="password" type="password" required maxlength="256" autocomplete="current-password"></label><label id="repeat-label" hidden>Nhập lại mật khẩu<input id="repeat" type="password" maxlength="256" autocomplete="new-password"></label><button id="submit">Tiếp tục</button></form><div id="error" class="error" role="alert"></div><div class="foot">Merasys chỉ có một tài khoản quản trị.</div></main>
<script>
const $=id=>document.getElementById(id);let registered=true,busy=false;
async function request(path,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(path,{credentials:'same-origin',cache:'no-store',...options,headers:{'Content-Type':'application/json','X-Merasys-Request':'1',...options.headers},signal:controller.signal});const result=await response.json();if(!response.ok)throw new Error(typeof result.detail==='string'?result.detail:'Thông tin không hợp lệ.');return result;}finally{clearTimeout(timer)}}
async function mode(){const state=await request('/api/auth/state');if(state.authenticated){location.replace('/');return;}registered=state.registered;$('title').textContent=registered?'Đăng nhập':'Tạo tài khoản quản trị';$('subtitle').textContent=registered?'Đăng nhập để theo dõi hệ thống và thay đổi cấu hình.':'Đây là lần khởi động đầu tiên. Tạo tài khoản duy nhất để bắt đầu thiết lập.';$('repeat-label').hidden=registered;$('repeat').required=!registered;$('password').minLength=registered?1:12;$('password').autocomplete=registered?'current-password':'new-password';$('submit').textContent=registered?'Đăng nhập':'Đăng ký và bắt đầu';$('form').hidden=false;}
$('form').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;$('error').textContent='';if(!registered&&$('password').value!==$('repeat').value){$('error').textContent='Hai mật khẩu không khớp.';return;}busy=true;$('submit').disabled=true;try{await request(registered?'/api/auth/login':'/api/auth/register',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});location.replace('/');}catch(error){$('error').textContent=error.name==='AbortError'?'Chưa nhận phản hồi. Hãy thử đăng nhập lại.':error.message;try{await mode()}catch{}}finally{busy=false;$('submit').disabled=false}});
mode().catch(error=>{$('error').textContent=error.name==='AbortError'?'Không kết nối được máy chủ. Tải lại trang.':error.message});
</script></body></html>
